# Publica la versión web en EAS Hosting (expo.app): se abre desde cualquier navegador de PC o iPhone.
# Se ejecuta al subir una rama web/* o a mano desde la pestaña Actions.
# Requiere el secreto EXPO_TOKEN (token de acceso de expo.dev) en el repositorio.
name: Publicar versión web

on:
  push:
    branches: ["web/**"]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm test
      - run: eas init --non-interactive --force
      - run: npx expo export --platform web
      - run: eas deploy --prod --non-interactive
